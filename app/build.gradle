plugins { id 'com.android.application' }

android {
    namespace 'com.apexmotoriblaj.amb'
    compileSdk 36

    defaultConfig {
        applicationId 'com.apexmotoriblaj.amb'
        minSdk 29
        targetSdk 35
        versionCode 261
        versionName '2.6.1'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.google.mlkit:translate:17.0.3'
}
