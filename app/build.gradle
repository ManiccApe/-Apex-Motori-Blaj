plugins { id 'com.android.application' }

android {
    namespace 'com.apexmotoriblaj.amb'
    compileSdk 36

    defaultConfig {
        applicationId 'com.apexmotoriblaj.amb'
        minSdk 29
        targetSdk 35
        versionCode 23
        versionName '2.3'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
